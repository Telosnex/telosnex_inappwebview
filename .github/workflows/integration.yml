name: Integration

# The example's integration suite on every platform, one app launch per
# group (tool/run_integration_group.sh), against the Node test server.
on:
  push:
    branches: [master, 'ci/**']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          all, or some of: linux, macos, windows, ios, android, web
          (for example "android" or "android,ios")
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IAW_LIMIT: '900'
  IAW_LOGS: ${{ github.workspace }}/iaw-logs

jobs:
  # The pinned WPE SDK (wpe_sdk/prebuilt.json) on its own base system. The
  # Linux package's backend tests and the example's suite are separate jobs,
  # so they run at the same time.
  desktop-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: &linux_container
      image: ubuntu@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944 # 26.04
      # WebKit's processes share memory through /dev/shm, which Docker
      # limits to 64 MB: in a long launch web processes crashed.
      options: --shm-size=2g
    env:
      TARGET: ubuntu-26.04-x64
      SUITE: example
      # A CI container cannot create the bubblewrap sandbox's namespaces.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      DEBIAN_FRONTEND: noninteractive
    steps: &linux_steps
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build tools and the SDK's run-time packages
        run: |
          apt-get install -y -qq --no-install-recommends python3 > /dev/null
          read -ra runtime <<< "$(python3 -c "
          import json, sys
          t = json.load(open('telosnex_inappwebview_linux/wpe_sdk/prebuilt.json'))['targets'][sys.argv[1]]
          print(' '.join(t['runtimePackages']))" "$TARGET")"
          # Flutter's Linux toolchain, the plugin's pkg-config modules and the
          # SDK's (wpe_sdk/prebuilt.json: the .pc files need glib, libsoup,
          # xkbcommon), the display, and Node for the test server.
          apt-get install -y -qq --no-install-recommends \
            curl xz-utils unzip zstd clang g++ cmake ninja-build pkg-config \
            libgtk-3-dev libepoxy-dev libsecret-1-dev libwayland-dev \
            libsoup-3.0-dev libxkbcommon-dev \
            xvfb xauth dbus dbus-x11 gnome-keyring libgl1-mesa-dri libegl-mesa0 fonts-dejavu-core \
            nodejs npm \
            "${runtime[@]}" > /dev/null
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
      - run: npm ci
        if: ${{ env.SUITE == 'example' }}
        working-directory: test_node_server
      - name: Linux backend tests (telosnex_inappwebview_linux/example)
        if: ${{ env.SUITE == 'backend' }}
        working-directory: telosnex_inappwebview_linux/example
        run: |
          flutter pub get
          status=0
          for f in integration_test/*_test.dart; do
            echo "::group::$f"
            timeout "$IAW_LIMIT" dbus-run-session -- xvfb-run -a flutter test "$f" -d linux -r expanded || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Example integration suite
        if: ${{ env.SUITE == 'example' }}
        run: |
          (cd telosnex_inappwebview/example && flutter pub get)
          tool/run_integration_group.sh linux
      - if: ${{ !cancelled() && env.SUITE == 'example' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ env.TARGET }}
          path: ${{ env.IAW_LOGS }}
          if-no-files-found: ignore

  desktop-linux-x64-backend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    name: Linux x64 backend
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: *linux_container
    env:
      TARGET: ubuntu-26.04-x64
      SUITE: backend
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      DEBIAN_FRONTEND: noninteractive
    steps: *linux_steps

  desktop-linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container: *linux_container
    env:
      TARGET: ubuntu-26.04-arm64
      SUITE: example
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      DEBIAN_FRONTEND: noninteractive
    steps: *linux_steps

  desktop-linux-arm64-backend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    name: Linux ARM64 backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container: *linux_container
    env:
      TARGET: ubuntu-26.04-arm64
      SUITE: backend
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      DEBIAN_FRONTEND: noninteractive
    steps: *linux_steps

  desktop-macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos') }}
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVICE: macos
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
      - run: npm ci
        working-directory: test_node_server
      - run: flutter pub get
        working-directory: telosnex_inappwebview/example
      # An app that exits mid-run (no Dart error): Windows Error Reporting
      # writes a minidump of it.
      - name: Windows crash dumps
        if: ${{ env.DEVICE == 'windows' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:IAW_LOGS 'crash'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\telosnex_inappwebview_example.exe'
          New-Item -Force -Path $key | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dir -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 5 -Type DWord
      - name: Example integration suite
        run: tool/run_integration_group.sh "$DEVICE"
      # The app's crash and exit events, with their exception codes.
      - name: Collect Windows crash events
        if: ${{ !cancelled() && env.DEVICE == 'windows' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:IAW_LOGS 'crash'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026 } -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'telosnex_inappwebview_example|msedgewebview2' } |
            Format-List TimeCreated, Id, Message | Out-File (Join-Path $dir 'events.txt')
      # An app that exits mid-run (no Dart error) leaves a crash report.
      - name: Collect macOS crash reports
        if: ${{ !cancelled() && env.DEVICE == 'macos' }}
        run: |
          mkdir -p "$IAW_LOGS/crash"
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
            -name 'telosnex_inappwebview_example*' -exec cp {} "$IAW_LOGS/crash/" \; 2>/dev/null || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ env.DEVICE }}
          path: ${{ env.IAW_LOGS }}
          if-no-files-found: ignore

  desktop-windows-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows') }}
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      DEVICE: windows
    steps: *desktop_steps

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'ios') }}
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
      - run: npm ci
        working-directory: test_node_server
      - run: flutter pub get
        working-directory: telosnex_inappwebview/example
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        id: simulator
      - name: Example integration suite
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: tool/run_integration_group.sh "$UDID"
      # WebKit's own log from the simulator: a load that never ended (no
      # response, no error) shows there whether WebKit got the response and
      # what it decided.
      - name: Simulator WebKit log
        if: ${{ !cancelled() }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$IAW_LOGS"
          xcrun simctl spawn "$UDID" log show --last 2h --style compact \
            --predicate 'subsystem BEGINSWITH "com.apple.WebKit" OR process == "Runner"' \
            2>&1 | gzip > "$IAW_LOGS/simulator-webkit.log.gz" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-ios
          path: ${{ env.IAW_LOGS }}
          if-no-files-found: ignore

  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android') }}
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
      - run: npm ci
        working-directory: test_node_server
      - run: flutter pub get
        working-directory: telosnex_inappwebview/example
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        id: emulator
        with:
          api-level: '36'
      # A fresh Chrome opens with its first-run screens, which keep a Custom
      # Tab (ChromeSafariBrowser) from loading its page. Chrome reads these
      # flags when it is the debug app.
      - name: Skip Chrome's first run
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
        run: |
          adb -s "$SERIAL" shell 'echo "_ --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
          adb -s "$SERIAL" shell am set-debug-app --persistent com.android.chrome
      # The emulator vanished mid-run with nothing in its own log: the
      # runner's memory every 10 seconds, and its kernel log afterwards,
      # show whether the kernel killed it.
      # Gradle and Kotlin daemons stayed after the app build, holding 5 GB of
      # the runner's 16 next to the emulator. Each build exits instead.
      - name: No Gradle or Kotlin daemons
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.daemon=false\nkotlin.compiler.execution.strategy=in-process\n' >> ~/.gradle/gradle.properties
      - name: Watch the runner's memory
        run: |
          mkdir -p "$IAW_LOGS"
          while sleep 10; do
            {
              date -u +%T
              free -m | sed -n 2,3p
              ps -eo rss=,comm= --sort=-rss | head -5 | awk '{printf "  %d MB %s\n", $1/1024, $2}'
            } >> "$IAW_LOGS/runner-memory.log"
          done > /dev/null 2>&1 &
      - name: Example integration suite
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
          # The emulator crashed decoding the video tests' H.264 (no GPU on
          # the runner): see video_playback_policy.dart.
          IAW_NO_VIDEO: '1'
          # The emulator reaches the host at 10.0.2.2.
          NODE_SERVER_IP: 10.0.2.2
        run: tool/run_integration_group.sh "$SERIAL"
      - name: Runner kernel log
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$IAW_LOGS"
          sudo dmesg -T 2>&1 | tee "$IAW_LOGS/runner-dmesg.txt" > /dev/null || true
          {
            echo "== emulator process"; pgrep -a qemu || echo "not running"
            echo "== adb devices"; adb devices
            echo "== kills"; grep -iE "out of memory|oom|killed process" "$IAW_LOGS/runner-dmesg.txt" || echo none
          } | tee "$IAW_LOGS/runner-summary.txt"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-android
          # The emulator's own log and logcat: why a device went offline.
          path: |
            ${{ env.IAW_LOGS }}
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore

  web-linux-chrome-dart2js:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'web') }}
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # flutter drive on the web-server device, through web-driver's chromedriver.
      IAW_DRIVER: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
      - run: npm ci
        working-directory: test_node_server
      - run: flutter pub get
        working-directory: telosnex_inappwebview/example
      - uses: Telosnex/telosnex_ci_tools/actions/web-driver@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        with:
          browser: chrome
          artifact-name: logs-web
          # The response data of the last launch (the one-launch run, or a
          # unit's rerun) must show tests that passed: the run passed only
          # when every unit did.
          require-result: '.telosnexWebTestSummary.passed > 0'
          run: tool/run_integration_group.sh web-server
