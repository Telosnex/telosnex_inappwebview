name: Pub publish

on:
  push:
    tags:
      - 'pub-telosnex_inappwebview-v[0-9]+.[0-9]+.[0-9]+*'
      - 'pub-telosnex_inappwebview_*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate (pub-<package>-v<version>)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@0ab334b66d7bb8ff0f436b8e9739eb014ab35b79 # v0.5.24
    permissions:
      contents: write
      id-token: write
    with:
      dry-run: ${{ github.ref_type != 'tag' || github.event_name == 'workflow_dispatch' }}
      tag: ${{ inputs.tag || '' }}
      environment: pub.dev
      test: 'if [[ -d test ]]; then flutter test --no-pub; fi'
