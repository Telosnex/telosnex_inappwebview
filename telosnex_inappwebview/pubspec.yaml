name: telosnex_inappwebview
description: A Flutter plugin for an inline webview, a headless webview, and an in-app browser. A maintained fork of flutter_inappwebview, with a WPE WebKit Linux backend.
version: 1.1.1
homepage: https://github.com/Telosnex/telosnex_inappwebview
repository: https://github.com/Telosnex/telosnex_inappwebview/tree/master/telosnex_inappwebview
issue_tracker: https://github.com/Telosnex/telosnex_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  telosnex_inappwebview_platform_interface: ^1.1.0
    # path: ../telosnex_inappwebview_platform_interface
  telosnex_inappwebview_android: ^1.0.1
    # path: ../telosnex_inappwebview_android
  telosnex_inappwebview_ios: ^1.0.1
    # path: ../telosnex_inappwebview_ios
  telosnex_inappwebview_macos: ^1.0.1
    # path: ../telosnex_inappwebview_macos
  telosnex_inappwebview_web: ^1.0.1
    # path: ../telosnex_inappwebview_web
  telosnex_inappwebview_windows: ^1.0.1
    # path: ../telosnex_inappwebview_windows
  telosnex_inappwebview_linux: ^1.0.1
    # path: ../telosnex_inappwebview_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  generators:
    path: ../dev_packages/generators

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: telosnex_inappwebview_android
      ios:
        default_package: telosnex_inappwebview_ios
      macos:
        default_package: telosnex_inappwebview_macos
      web:
        default_package: telosnex_inappwebview_web
      windows:
        default_package: telosnex_inappwebview_windows
      linux:
        default_package: telosnex_inappwebview_linux

  assets:
    - packages/telosnex_inappwebview/assets/t_rex_runner/t-rex.html
    - packages/telosnex_inappwebview/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx

resolution: workspace
